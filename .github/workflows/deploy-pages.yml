name: Deploy BucharestUA Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate preview and release inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f preview-hospitals-bucharest.html
          grep -q 'name="robots" content="noindex' preview-hospitals-bucharest.html
          python3 - <<'PY'
          import pathlib, re, sys
          p=pathlib.Path('preview-hospitals-bucharest.html')
          s=p.read_text()
          photos=re.findall(r'<img\b[^>]*src="([^"]+)"',s)
          assert len(photos)>=4, f'Expected 4+ preview photos, found {len(photos)}'
          assert all(u.startswith('https://images.unsplash.com/') for u in photos), photos
          print('Preview validated:', len(photos), 'images')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate built site before upload
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/preview-hospitals-bucharest.html
          grep -q 'ПРЕДПРОСМОТР' _site/preview-hospitals-bucharest.html
          echo "Preview included in built Pages artifact"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live preview and its images
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,time,urllib.request,urllib.error,re,html
          root=os.environ['PAGE_URL'].rstrip('/')
          target=root+'/preview-hospitals-bucharest.html'
          data=None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(urllib.request.Request(target,headers={'User-Agent':'BucharestUA-Pages-QA/1.0'}),timeout=20) as r:
                      if r.status==200: data=r.read().decode('utf-8'); break
              except Exception as e: print('Waiting for Pages:',attempt+1,str(e))
              time.sleep(10)
          if not data: raise SystemExit('PREVIEW NOT LIVE: '+target)
          assert 'ПРЕДПРОСМОТР' in data
          assert 'noindex' in data
          urls=[html.unescape(x) for x in re.findall(r'<img\b[^>]*src="([^"]+)"',data)]
          if len(urls)<4: raise SystemExit('Missing preview images')
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Range':'bytes=0-100'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  if r.status not in (200,206): raise SystemExit('Broken image '+url)
          print('VERIFIED LIVE PREVIEW:',target,'photos:',len(urls))
          PY
