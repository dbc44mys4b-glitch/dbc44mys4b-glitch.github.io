name: BucharestUA public release smoke check

on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'

permissions:
  contents: read

concurrency:
  group: bucharestua-public-smoke
  cancel-in-progress: true

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify live site, sitemap and existing published pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error, xml.etree.ElementTree as ET
          from urllib.parse import urlsplit
          base = "https://dbc44mys4b-glitch.github.io"
          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "BucharestUA-Public-Smoke/1.1"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  body = r.read(5_000_000)
                  status = r.status
                  ctype = r.headers.get("Content-Type", "")
                  final = r.url
              if status != 200 or len(body) < 100 or urlsplit(final).netloc != urlsplit(base).netloc:
                  raise ValueError(f"Unexpected status/size/redirect for {url}: status={status} bytes={len(body)} final={final}")
              return body, ctype
          homepage, homepage_type = fetch(base + "/")
          if b"<html" not in homepage.lower() or "html" not in homepage_type.lower():
              raise ValueError("Homepage is not HTML")
          print("PASS homepage")
          sitemap, _ = fetch(base + "/sitemap.xml")
          root = ET.fromstring(sitemap)
          urls = [e.text.strip() for e in root.iter() if e.tag.endswith("}loc") or e.tag == "loc"]
          urls = [u for u in urls if u and urlsplit(u).netloc == urlsplit(base).netloc and urlsplit(u).path.lower().endswith(("/", ".html", ".htm"))]
          if not urls:
              raise ValueError("No same-origin published HTML URLs in sitemap")
          print(f"PASS sitemap: {len(urls)} published HTML URLs declared")
          for url in urls[:5]:
              body, ctype = fetch(url)
              if b"<html" not in body.lower() or "html" not in ctype.lower():
                  raise ValueError(f"Not an HTML page: {url}")
              print(f"PASS published URL: {url}")
          print("Public smoke PASS. Does NOT certify editorial QA, freshness, or new publications.")
          PY
