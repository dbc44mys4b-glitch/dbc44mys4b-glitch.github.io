name: BucharestUA daily SEO and editorial cycle
on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: bucharestua-seo-main
  cancel-in-progress: false

jobs:
  grow-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Get website source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve freely licensed real photographs and credit creators
        run: python scripts/editorial_media.py
      - name: Publish due prewritten editorial guides
        run: python scripts/publish_queue.py
      - name: Generate RSS and shareable Telegram drafts
        run: python scripts/social_feed.py
      - name: Pre-publication quality gate - BLOCK bad photos or broken pages
        run: python scripts/prepublish_check.py
      - name: Save published guides to main
        id: publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' sitemap.xml sitemap.txt feed.xml social/telegram-drafts.md social/telegram-posts.json media/assigned-images.json assets/covers/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No editorial changes due."
          else
            git commit -m "Editorial: publish scheduled BucharestUA community guide"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Request Pages rebuild for branch-based Pages
        if: steps.publication.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages/builds"             && echo "Requested Pages rebuild."             || echo "Pages rebuild request unavailable. Check GitHub Pages publishing source."
      - name: Audit SEO and public URLs
        run: python scripts/seo_audit.py
      # Audit reports are uploaded as run artifacts, not committed on every run.
      # Committing them caused unnecessary Pages builds and cancelled deployments.
      - name: Report results
        if: always()
        run: |
          if [ -f reports/seo-audit.md ]; then
            cat reports/seo-audit.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'SEO audit did not produce a report; inspect logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Store daily report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bucharestua-seo-audit
          path: reports/
          retention-days: 30
          if-no-files-found: warn
